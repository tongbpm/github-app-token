version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: github-app-token
    main: ./cmd/github-app-token
    binary: github-app-token
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: tongbpm
    name: github-app-token
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Installation

    Download the appropriate binary for your platform from the assets below.

    ### Using Go
    ```bash
    go install github.com/tongbpm/github-app-token/cmd/github-app-token@{{ .Tag }}
    ```

  footer: |
    ---
    **Full Changelog**: https://github.com/tongbpm/github-app-token/compare/{{ .PreviousTag }}...{{ .Tag }}

    Released with [GoReleaser](https://goreleaser.com)
